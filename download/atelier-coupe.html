<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier — coupe du tissu</title>
<meta name="description" content="Atelier de coupe sur-mesure : patron, plombage, coupe animée, assemblage en images et aperçu du vêtement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0E9;--bg2:#E9E6DC;--card:#FBFAF6;--ink:#262A3D;--mute:#7A7F92;
  --line:#DCD9CE;--line2:#CBC7B9;--chalk:#C2255C;--gold:#B08D57;--ok:#3E7C59;
  --form:#E7E3D7;--formline:#C9C4B4;--gstroke:rgba(25,28,40,.55);
  --shadow:0 1px 2px rgba(35,40,60,.05),0 18px 44px -30px rgba(35,40,60,.38);
  --hd:60px;--r:18px;
}
[data-theme=dark]{
  --bg:#141519;--bg2:#1B1D23;--card:#1E2027;--ink:#ECEAE2;--mute:#8E93A3;
  --line:#2E313B;--line2:#3C404C;--chalk:#E76E93;--gold:#C9A56A;--ok:#6FBF94;
  --form:#262932;--formline:#3C404C;--gstroke:rgba(15,16,22,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -26px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Figtree,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
h1,h2,h3,h4,.dfont{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
.pv{width:100%;height:auto;max-height:72vh}

/* ---------- Header ---------- */
.hd{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--card);
  display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:1.18rem;font-weight:800;line-height:1}
.brand p{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-top:2px}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.fabs{display:flex;gap:6px;padding:5px 7px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.fdot{width:17px;height:17px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;transition:.18s;position:relative}
.fdot.on{transform:scale(1.22);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.icobtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;transition:.18s}
.icobtn:hover{transform:translateY(-1px)}
.icobtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.wrap{display:grid;grid-template-columns:1fr;gap:16px;max-width:1280px;margin:0 auto;
  padding:16px max(14px,env(safe-area-inset-left)) 60px max(14px,env(safe-area-inset-right))}
@media(min-width:1020px){.wrap{grid-template-columns:344px 1fr;align-items:start}
  .side{position:sticky;top:calc(var(--hd) + 14px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px}
.ov{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:3px}
.card h2{font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sn{width:23px;height:23px;border-radius:8px;background:var(--ink);color:var(--card);font-size:.72rem;
  font-weight:700;display:grid;place-items:center;font-family:Figtree}
.card h3{font-size:1.3rem;font-weight:800}
.muted{color:var(--mute)}
.small{font-size:.8rem}

/* ---------- Chips modèles ---------- */
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:430px){.mods{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1020px){.mods{grid-template-columns:repeat(2,1fr)}}
.chip{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border:1px solid var(--line);
  border-radius:14px;background:var(--bg2);transition:.18s;text-align:left}
.chip:hover{transform:translateY(-1px);border-color:var(--line2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.chip b{font-size:.74rem;font-weight:600;line-height:1.15}
.lvl{display:flex;gap:3px}
.lvl i{width:4.5px;height:4.5px;border-radius:50%;background:var(--gold);opacity:.28}
.lvl i.f{opacity:1}
#mdesc{margin-top:11px;font-size:.82rem;color:var(--mute)}

/* ---------- Mesures ---------- */
.mrow{display:grid;grid-template-columns:86px 58px 1fr;gap:8px;align-items:center;padding:5px 0}
.mlab{font-size:.78rem;font-weight:600}
.mlab i{font-style:normal;color:var(--mute);font-weight:500;font-size:.68rem;display:block}
.nin{width:58px;padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--bg2);font-weight:600;font-size:.82rem}
input[type=range]{width:100%;accent-color:var(--chalk);height:22px}
.mset{margin-top:8px;border-top:1px dashed var(--line);padding-top:9px}
.mset summary{font-size:.78rem;font-weight:600;color:var(--mute);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.mset summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--mute);border-bottom:1.6px solid var(--mute);transform:rotate(-45deg);transition:.2s}
.mset[open] summary::before{transform:rotate(45deg)}

/* ---------- Cliente ---------- */
.selwrap select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-size:.85rem;font-weight:600}
#nm{width:100%;margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-size:.85rem}
.btnrow{display:flex;gap:8px;margin-top:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:12px;
  font-weight:700;font-size:.82rem;transition:.18s;border:1px solid var(--line);background:var(--bg2)}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.chalk{background:var(--chalk);color:#fff;border-color:var(--chalk)}
.btn.gh{background:transparent}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:5px;overflow-x:auto;position:sticky;top:var(--hd);z-index:30;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  padding:8px 2px;margin:-8px -2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid transparent;
  color:var(--mute);font-weight:600;font-size:.82rem;white-space:nowrap;transition:.18s}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Vues ---------- */
.view-in{animation:fadeUp .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.pv-box{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:10px;overflow:hidden}
.pv-note{font-size:.75rem;color:var(--mute);margin-top:9px}
.desc{font-size:.9rem}
.statrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.stat{font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--mute)}
.stat b{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{font-size:1.06rem;font-family:'Bricolage Grotesque';display:block;line-height:1.15}
.kpi span{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}

.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.zoom{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--mute);font-weight:700}
.zoom input{width:110px}

.boardwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg2);
  box-shadow:inset 0 2px 14px rgba(0,0,0,.07);max-height:70vh}
.boardwrap>svg{display:block}
.pc{cursor:default}
.pc-i{cursor:pointer}
.pc-i:hover .pp{fill:rgba(255,255,255,.32)}
.pp{fill:rgba(255,255,255,.20);stroke:var(--gstroke);stroke-width:.45;transition:fill .4s}
.cutp .pp{fill:rgba(255,255,255,.05);stroke-dasharray:1.6 1.2;opacity:.55}
.cutline{fill:none;stroke:var(--chalk);stroke-width:.95;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.cutline.go{transition:stroke-dashoffset 1s cubic-bezier(.5,0,.3,1);stroke-dashoffset:0}
.plbl{font:600 3.4px Figtree,sans-serif;fill:#fff;opacity:.92;paint-order:stroke;stroke:rgba(0,0,0,.25);stroke-width:.6}
.cutp .plbl{opacity:.55}

.prog{height:7px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--chalk));border-radius:99px;
  transition:width .5s cubic-bezier(.3,.7,.3,1)}

.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tchip{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
.tchip svg{width:40px;height:40px;flex:none}
.tchip b{font-size:.76rem;display:block;line-height:1.2}
.tchip span{font-size:.66rem;color:var(--mute);font-weight:600}
.empty{padding:16px;border:1px dashed var(--line2);border-radius:14px;color:var(--mute);font-size:.82rem;text-align:center}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;box-shadow:var(--shadow)}
.pcard .pvb{background:var(--bg2);border-radius:11px;padding:8px;margin-bottom:9px}
.pcard svg{width:100%;height:auto;max-height:170px}
.pcard b{font-size:.84rem}
.pmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.badge{font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--mute)}
.badge.acc{background:color-mix(in srgb,var(--chalk) 12%,var(--card));border-color:color-mix(in srgb,var(--chalk) 30%,var(--line));color:var(--chalk)}

.note{display:flex;gap:10px;padding:11px 13px;border-radius:13px;background:color-mix(in srgb,var(--gold) 10%,var(--card));
  border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line));font-size:.8rem;margin-bottom:12px}
.note svg{width:17px;height:17px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.warnbox{padding:11px 13px;border-radius:13px;background:color-mix(in srgb,var(--chalk) 9%,var(--card));
  border:1px solid color-mix(in srgb,var(--chalk) 30%,var(--line));font-size:.8rem;margin-bottom:12px}
.warnbox b{color:var(--chalk)}

/* ---------- Assemblage ---------- */
.asmstage{border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--card) 55%,var(--bg2)),var(--bg2));
  padding:10px;overflow:hidden}
.asmstage svg{width:100%;height:auto}
.apg{transition:transform .95s cubic-bezier(.55,.06,.25,1)}
.aplbl{font:600 5px Figtree,sans-serif;fill:var(--ink);opacity:.62}
.seamline{stroke:var(--chalk);stroke-width:.9;stroke-dasharray:2.6 2;stroke-linecap:round;animation:seamIn .6s both}
@keyframes seamIn{from{opacity:0}to{opacity:1}}
.asmctl{display:flex;gap:8px;margin-top:12px;align-items:center}
.asmctl .grow{flex:1}
.asmstep{margin-top:11px;padding:11px 13px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);
  font-size:.86rem;font-weight:600;min-height:44px;display:flex;gap:10px;align-items:center}
.asmstep .stno{flex:none;width:26px;height:26px;border-radius:9px;background:var(--chalk);color:#fff;
  display:grid;place-items:center;font-size:.72rem;font-weight:800}
.asmhist{list-style:none;margin-top:11px;display:flex;flex-direction:column;gap:5px}
.asmhist li{font-size:.78rem;color:var(--mute);display:flex;gap:8px;align-items:center;padding:5px 9px;border-radius:9px}
.asmhist li.done{color:var(--ink)}
.asmhist li.cur{background:var(--bg2);font-weight:600;color:var(--ink)}
.asmhist li i{flex:none;width:15px;height:15px;border-radius:50%;border:1.4px solid var(--line2);font-size:.6rem;
  display:grid;place-items:center;font-style:normal;font-weight:800}
.asmhist li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.asm-done{animation:fadeUp .5s .15s both}
.asm-done .pv{max-height:52vh}

/* ---------- Méthode ---------- */
.mth{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:4px}
.mth li{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);transition:.2s;font-size:.88rem}
.mth li .ck{flex:none;width:22px;height:22px;border-radius:8px;border:1.6px solid var(--line2);margin-top:1px;
  display:grid;place-items:center;transition:.18s}
.mth li .ck svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mth li.done{background:var(--bg2)}
.mth li.done .ck{background:var(--ok);border-color:var(--ok)}
.mth li.done .ck svg{opacity:1}
.mth li.done span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
.mth .mno{color:var(--mute);font-weight:700;font-size:.74rem;margin-top:3px}

footer{max-width:1280px;margin:0 auto;padding:18px 14px calc(18px + env(safe-area-inset-bottom));
  color:var(--mute);font-size:.72rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,80px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.82rem;font-weight:600;
  box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s;opacity:0;z-index:90;max-width:88vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<header class="hd">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="2.4"/><circle cx="5.5" cy="18" r="2.4"/><path d="M7.6 7.3 19 17M7.6 16.7 19 7M13 12l1.2 1"/></svg></span>
    <div><h1>Atelier</h1><p>coupe du tissu</p></div>
  </div>
  <div class="hd-actions">
    <div class="fabs" id="fabs" title="Tissu"></div>
    <button class="icobtn" id="theme" aria-label="Thème"></button>
  </div>
</header>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <main class="mainc">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </main>
</div>
<footer><span>Atelier — coupe du tissu · patrons paramétriques sur vos mesures</span><span>Fait main, avec soin</span></footer>
<div id="toast"></div>
<script>
"use strict";
/* ================= Utilitaires ================= */
const $=s=>document.querySelector(s);
const r1=x=>Math.round(x*10)/10;
const fmt=x=>String(r1(x)).replace('.',',');
let UIDC=0;const uid=()=>'u'+(++UIDC);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms)}}

/* ================= État & persistance ================= */
const DEFM={P:92,T:74,H:100,L:58,C:58,W:150,S:1};
const ST={style:'droite',m:{...DEFM},color:0,theme:null,client:null,clients:{},
  cut:new Set(),step:0,z:1,checked:{},tab:'apercu'};
let LASTSIG='';
const KEY='atelier-v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify({
  style:ST.style,m:ST.m,color:ST.color,theme:ST.theme,client:ST.client,
  clients:ST.clients,checked:ST.checked,z:ST.z}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
  Object.assign(ST,{style:d.style||'droite',color:d.color||0,client:d.client||null,
    clients:d.clients||{},checked:d.checked||{},z:d.z||1});
  ST.theme=d.theme||null;
  if(d.m)for(const k in DEFM)if(isFinite(d.m[k]))ST.m[k]=+d.m[k];
}catch(e){}}

/* ================= Tissus ================= */
const FABRICS=[
  {n:'Sauge',c:'#93A586',d:'#6F8262',lw:0},
  {n:'Terracotta',c:'#C0714A',d:'#9C5535',lw:1},
  {n:'Indigo',c:'#55639E',d:'#3E4A7C',lw:1},
  {n:'Sable',c:'#D3BC8D',d:'#B39A67',lw:0},
  {n:'Prune',c:'#7C5A78',d:'#5E425C',lw:1},
  {n:'Rosé',c:'#D29A9F',d:'#B2767D',lw:0},
  {n:'Charbon',c:'#4A4D55',d:'#33353B',lw:1}
];
const fab=()=>FABRICS[ST.color]||FABRICS[0];

/* ================= Générateurs de pièces ================= */
const rect=(w,h)=>`M0 0H${r1(w)}V${r1(h)}H0Z`;
const bandP=(m,len,h=6)=>({n:'Ceinture',d:rect(len,h),w:r1(len),h:r1(h),q:1,fold:1});
const skirtP=(m,o={})=>{const back=!!o.back,fl=o.fl!=null?o.fl:.35,len=o.len||m.L;
  const wt=(m.T+6)/2,hh=(m.H+8)/2,yh=Math.min(len*.25,22),hm=hh+(len-yh)*fl;
  return{n:back?'Dos':'Devant',q:1,fold:1,w:r1(Math.max(hm,hh)),h:r1(len),
    d:`M0 0L${r1(wt)} 0C${r1((wt+hh)/2)} ${r1(yh*.35)} ${r1(hh)} ${r1(yh*.6)} ${r1(hh)} ${r1(yh)}C${r1(hh+(hm-hh)*.25)} ${r1(yh+(len-yh)*.4)} ${r1(hm)} ${r1(len*.78)} ${r1(hm)} ${r1(len)}L0 ${r1(len)}Z`}};
const wrapP=(m,o={})=>{const back=!!o.back,ext=o.ext||0;
  const wt=(m.T+6)/2+ext,hh=(m.H+8)/2+ext,yh=Math.min(m.L*.25,22),hm=hh+(m.L-yh)*.3;
  return{n:o.n||(back?'Dos':'Devant'),q:1,fold:back?1:0,w:r1(Math.max(hm,hh)),h:r1(m.L),

let CALC=null,CALCsig='';
const sig=()=>[ST.style,ST.m.P,ST.m.T,ST.m.H,ST.m.L,ST.m.C,ST.m.W,ST.m.S].join('_');
function calc(){const s=sig();
  if(CALC&&CALCsig===s)return CALC;
  const m=ST.m,sa=m.S,W=m.W,usable=W-4,warns=[];
  let pcs=[];
  try{pcs=MODELS[ST.style].g(m)}catch(e){pcs=[]}
  pcs.forEach(p=>{if(p.w+2*sa>usable)warns.push(`« ${p.n} » dépasse la laize utile (${r1(p.w+2*sa)} cm nécessaires pour ${usable} cm) — élargissez la laize ou modifiez la coupe.`)});
  const occs=[];pcs.forEach((p,i)=>{for(let k=0;k<p.q;k++)occs.push({p,i,k})});
  occs.sort((a,b)=>b.p.h-a.p.h);
  let x=0,y=8,rh=0,len=8;const placed=[];
  occs.forEach(o=>{const bw=r1(o.p.w+2*sa),bh=r1(o.p.h+2*sa);
    if(x>0&&x+bw>usable-1){x=0;y+=rh+1.2;rh=0}
    placed.push({p:o.p,i:o.i,k:o.k,x:r1(x+sa),y:r1(y+sa)});
    x=r1(x+bw+1.2);rh=Math.max(rh,bh);len=Math.max(len,y+rh)});
  len=r1(len+sa+2);
  CALC={pcs,placed,len,warns,tot:placed.length};CALCsig=s;return CALC}
function ensureSig(){const s=sig();
  if(s!==LASTSIG){ST.cut.clear();ST.step=0;LASTSIG=s;save()}}

function asmLayout(){const {pcs}=calc();
 const W=Math.max(170,Math.min(330,pcs.reduce((s,p)=>s+p.w,0)+10*pcs.length));
 let x=6,y=6,rh=0;const init=pcs.map(p=>{if(x>6&&x+p.w>W){x=6;y+=rh+14;rh=0}
  const q={x:r1(x),y:r1(y)};x=r1(x+p.w+10);rh=Math.max(rh,p.h);return q});
 return{init,W}}
function asmPose(n){const {pcs}=calc(),steps=MODELS[ST.style].asm,{init}=asmLayout();
 const pos=init.map(q=>({...q})),mir=init.map(()=>false);let seam=null;
 for(let k=0;k<n&&k<steps.length;k++){const st=steps[k];if(st.s==null)continue;
  const a=pos[st.a],aw=pcs[st.a].w,bw=pcs[st.b].w,bh=pcs[st.b].h;let t;
  if(st.s==='rl')t={x:r1(a.x+aw),y:a.y};
  else if(st.s==='lr')t={x:r1(a.x-bw),y:a.y};
  else if(st.s==='rr')t={x:r1(a.x+aw),y:a.y,mir:1};
  else if(st.s==='ll')t={x:r1(a.x-bw),y:a.y,mir:1};
  else if(st.s==='tt')t={x:a.x,y:r1(a.y-bh)};
  else t={x:a.x,y:r1(a.y+pcs[st.a].h)};
  pos[st.b]=t;mir[st.b]=!!t.mir;seam={s:st.s,a:st.a,b:st.b,at:{...a}}}
 return{pos,mir,seam}}
function seamCoords(sm,pcs){const A=pcs[sm.a],B=pcs[sm.b],a=sm.at;
 if(sm.s==='rl'||sm.s==='rr')return[a.x+A.w,a.y,a.x+A.w,a.y+Math.min(A.h,B.h)];
 if(sm.s==='ll'||sm.s==='lr')return[a.x,a.y,a.x,a.y+Math.min(A.h,B.h)];
 if(sm.s==='tt')return[a.x,a.y,a.x+Math.min(A.w,B.w),a.y];
 return[a.x,a.y+A.h,a.x+Math.min(A.w,B.w),a.y+A.h]}
function asmSVG(){const {pcs}=calc(),c=fab(),{init,W}=asmLayout(),steps=MODELS[ST.style].asm;
 const fin=asmPose(steps.length).pos;const u=uid();
 let mnX=0,mxX=W,mnY=0,mxY=0;
 for(let i=0;i<pcs.length;i++){mnX=Math.min(mnX,init[i].x,fin[i].x);mxX=Math.max(mxX,init[i].x+pcs[i].w,fin[i].x+pcs[i].w);
  mnY=Math.min(mnY,init[i].y,fin[i].y);mxY=Math.max(mxY,init[i].y+pcs[i].h,fin[i].y+pcs[i].h)}
 let s='<svg id="asmSvg" viewBox="'+r1(mnX-8)+' '+r1(mnY-8)+' '+r1(mxX-mnX+16)+' '+r1(mxY-mnY+20)+'">'+gDefs(u)
  +'<line id="asmSeam" style="display:none" stroke-linecap="round"/>';
 pcs.forEach((p,i)=>{s+='<g class="apg" id="apg'+i+'" style="transform:translate('+init[i].x+'px,'+init[i].y+'px)">'
  +'<path d="'+p.d+'" fill="'+c.c+'" fill-rule="'+(p.even?'evenodd':'nonzero')+'"/>'
  +'<path d="'+p.d+'" fill="url(#wv'+u+')" fill-rule="evenodd"/>'
  +'<path d="'+p.d+'" fill="none" stroke="'+GS+'" stroke-width=".4" stroke-linejoin="round"/>'
  +'<text class="aplbl" x="1.6" y="6.4">'+p.n+'</text></g>'});
 return s+'</svg>'}
function applyAsm(n){const {pcs}=calc(),steps=MODELS[ST.style].asm;n=clamp(n,0,steps.length);ST.step=n;
 const {pos,mir,seam}=asmPose(n);
 pcs.forEach((p,i)=>{const g=document.getElementById('apg'+i);if(!g)return;
  g.style.transform=mir[i]?'translate('+r1(pos[i].x+p.w)+'px,'+r1(pos[i].y)+'px) scale(-1,1)'
   :'translate('+r1(pos[i].x)+'px,'+r1(pos[i].y)+'px)'});
 const sEl=document.getElementById('asmSeam');
 if(sEl){if(seam&&n>0){const c4=seamCoords(seam,pcs);
   sEl.setAttribute('x1',r1(c4[0]));sEl.setAttribute('y1',r1(c4[1]));sEl.setAttribute('x2',r1(c4[2]));sEl.setAttribute('y2',r1(c4[3]));
   sEl.setAttribute('stroke','var(--chalk)');sEl.setAttribute('stroke-width','.9');sEl.setAttribute('stroke-dasharray','2.6 2');
   sEl.style.display='';sEl.classList.remove('seamline');void sEl.getBoundingClientRect();sEl.classList.add('seamline')}
  else sEl.style.display='none'}
 const lbl=document.getElementById('asmLbl');
 if(lbl){if(n===0)lbl.innerHTML='<span class="stno">·</span>Pièces en place — lancez l’assemblage';
  else if(n>=steps.length)lbl.innerHTML='<span class="stno" style="background:var(--ok)">'+steps.length+'</span>Terminé — aperçu du vêtement ci-dessous';
  else lbl.innerHTML='<span class="stno">'+n+'/'+steps.length+'</span>'+steps[n-1].l}
 const hist=document.getElementById('asmHist');
 if(hist)hist.innerHTML=steps.map((st,i)=>'<li class="'+(i<n?'done':(i===n?'cur':''))+'"><i>'+(i<n?'✓':i+1)+'</i>'+st.l+'</li>').join('');
 const dn=document.getElementById('asmDone');if(dn)dn.hidden=n<steps.length}

function togglePlay(){if(playT){stopPlay();return}

function bindView(){const v=ST.tab;
 if(v==='plombage'||v==='coupe'){const zm=$('#zm');
  if(zm)zm.addEventListener('input',e=>{ST.z=+e.target.value;save();
   const svg=$('#bw svg');if(svg)svg.style.width=(ST.z*100).toFixed(0)+'%'})}
 if(v==='coupe'){
  document.querySelectorAll('#bw .pc-i').forEach(g=>g.addEventListener('click',()=>doCut(+g.dataset.k)));
  const ba=$('#btAll');if(ba)ba.addEventListener('click',cutAll);
  const br=$('#btRst');if(br)br.addEventListener('click',resetCut)}
 if(v==='asm'){applyAsm(ST.step);
  $('#aNext').addEventListener('click',()=>{stopPlay();asmNext()});
  $('#aPrev').addEventListener('click',()=>{stopPlay();asmPrev()});
  $('#aRst').addEventListener('click',()=>{stopPlay();applyAsm(0)});
  $('#aPlay').addEventListener('click',togglePlay)}
 if(v==='meth'){document.querySelectorAll('.mth li').forEach((li,i)=>{
   li.querySelector('.ck').addEventListener('click',()=>toggleMeth(i))});
  const mr=$('#mthRst');if(mr)mr.addEventListener('click',()=>{ST.checked[ST.style]=[];save();renderView()})}}
function toggleMeth(i){const arr=ST.checked[ST.style]||[];arr[i]=!arr[i];
 ST.checked[ST.style]=arr;save();renderView()}

/* ================= Fiches cliente ================= */
function saveClient(){const nm=($('#nm').value||'').trim();
 if(!nm){toast('Donnez un nom à la fiche');return}
 if(ST.client&&ST.client!==nm&&ST.clients[ST.client])delete ST.clients[ST.client];
 ST.clients[nm]={P:ST.m.P,T:ST.m.T,H:ST.m.H,L:ST.m.L,C:ST.m.C};
 ST.client=nm;save();renderSide();toast('Fiche « '+nm+' » enregistrée')}
function delClient(){if(!ST.client){toast('Aucune fiche sélectionnée');return}
 const nm=ST.client;delete ST.clients[nm];ST.client=null;save();renderSide();toast('Fiche « '+nm+' » supprimée')}

/* ================= Thème & démarrage ================= */
function applyTheme(t){document.documentElement.dataset.theme=t||ST.theme||'light';renderTheme()}
function boot(){load();
 ST.theme=ST.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 applyTheme(ST.theme);LASTSIG=sig();
 renderFabs();renderSide();renderTabs();renderView();
 $('#fabs').addEventListener('click',e=>{const b=e.target.closest('.fdot');if(!b)return;
  ST.color=+b.dataset.i;save();renderFabs();renderView()});
 $('#theme').addEventListener('click',()=>{
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');save()});
 $('#side').addEventListener('click',e=>{
  const ch=e.target.closest('.chip');if(ch){setStyle(ch.dataset.k);return}
  if(e.target.closest('#sv')){saveClient();return}
  if(e.target.closest('#dl')){delClient();return}});
 $('#side').addEventListener('input',e=>{
  const mk=e.target.dataset.mk;if(!mk)return;
  const val=e.target.value;if(val===''||isNaN(+val))return;
  const v=clamp(+val,+e.target.min,+e.target.max);
  ST.m[mk]=v;ensureSig();save();
  document.querySelectorAll('#side [data-mk="'+mk+'"]').forEach(el=>{if(el!==e.target)el.value=v});
  renderViewDeb()});
 $('#side').addEventListener('change',e=>{
  if(e.target.id!=='csl')return;const v=e.target.value;
  if(v==='__new'){ST.client=null;$('#nm').value='';toast('Saisissez le nom puis Enregistrer');return}
  if(v&&ST.clients[v]){ST.client=v;
   ['P','T','H','L','C'].forEach(k=>{if(ST.clients[v][k]!=null)ST.m[k]=ST.clients[v][k]});
   $('#nm').value=v;ensureSig();save();renderSide();renderView();toast('Fiche de '+v+' chargée')}
  else if(!v){ST.client=null;save()}});
 $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setTab(b.dataset.t)});
}
boot();


</script>
</body>
</html>
